name: YAWMI Android Widgets — Safe Signed Update

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/yawmi-android-apk.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: yawmi-android-release-verified
  cancel-in-progress: false

jobs:
  android-release:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout public PWA source
        uses: actions/checkout@v4

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Configure Android SDK without the removed legacy tools package
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'

      - name: Install Android platform and build tools
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare artwork
        shell: bash
        run: |
          mkdir -p android/app/src/main/res/drawable-nodpi
          cp icon-512.png android/app/src/main/res/drawable-nodpi/yawmi_icon.png
          file android/app/src/main/res/drawable-nodpi/yawmi_icon.png

      - name: Bundle all YAWMI public app screens, JS, CSS and icons into APK
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p android/app/src/main/assets/www
          for file in *.html *.js *.css *.png *.jpg *.jpeg *.svg *.webmanifest *.ico; do
            cp "$file" android/app/src/main/assets/www/
          done
          for required in index.html 01_ATLAS_Executive.html 02_JOURNAL_Editorial.html 03_QUEST_RPG.html cloud.js config.js yawmi-native-widgets-v1.js sw.js; do
            test -s "android/app/src/main/assets/www/$required"
          done
          echo "Bundled static assets:"
          find android/app/src/main/assets/www -type f | wc -l

      - name: Bundle pinned public Supabase SDK for a reliable offline shell
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p android/app/src/main/assets/vendor
          curl -fLsS --retry 3 --connect-timeout 12 --max-time 80             "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"             -o android/app/src/main/assets/vendor/supabase.min.js
          test "$(wc -c < android/app/src/main/assets/vendor/supabase.min.js)" -gt 100000
          sha256sum android/app/src/main/assets/vendor/supabase.min.js

      - name: Build widget debug APK (testing only — not a signed public update)
        shell: bash
        run: |
          gradle -p android --no-daemon :app:assembleDebug
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging android/app/build/outputs/apk/debug/app-debug.apk | head -12

      - name: Upload widget debug build for QA
        uses: actions/upload-artifact@v4
        with:
          name: YAWMI_ANDROID_V1_3_0_WIDGET_DEBUG_NOT_A_PUBLIC_UPDATE
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Build NON-DEBUG unsigned release package
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon :app:assembleRelease --stacktrace
          APK='android/app/build/outputs/apk/release/app-release-unsigned.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | tee /tmp/yawmi-release-manifest.txt
          grep -F "package: name='com.yawmilife.app'" /tmp/yawmi-release-manifest.txt
          grep -F "versionCode='4'" /tmp/yawmi-release-manifest.txt
          if grep -F 'application-debuggable' /tmp/yawmi-release-manifest.txt; then
            echo "Refusing to distribute a debuggable release" >&2
            exit 1
          fi

      - name: Upload original-app unsigned release package
        uses: actions/upload-artifact@v4
        with:
          name: YAWMI_ANDROID_V1_3_0_UNSIGNED_RELEASE_FOR_ORIGINAL_KEY_ONLY
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 7

      - name: Preserve official Android apksigner tool for independent verification
        uses: actions/upload-artifact@v4
        with:
          name: YAWMI_OFFICIAL_ANDROID_APKSIGNER_35
          path: ${{ env.ANDROID_HOME }}/build-tools/35.0.0/lib/apksigner.jar
          if-no-files-found: error
          retention-days: 2

      - name: Restore ORIGINAL Android signing identity (never generate a replacement key)
        shell: bash
        env:
          STORED_KEY_B64: ${{ secrets.YAWMI_ANDROID_KEYSTORE_B64 }}
          STORED_KEY_PASS: ${{ secrets.YAWMI_ANDROID_KEYSTORE_PASSWORD }}
          RECOVERY_PRIVATE_KEY_B64: ${{ secrets.YAWMI_SIGNING_RECOVERY_PRIVATE_KEY_B64 }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          echo "SIGNING_READY=false" >> "$GITHUB_ENV"
          KEY_PATH="$RUNNER_TEMP/yawmi-release.jks"
          if [[ -n "$STORED_KEY_B64" && -n "$STORED_KEY_PASS" ]]; then
            printf '%s' "$STORED_KEY_B64" | base64 -d > "$KEY_PATH"
            KEY_PASS="$STORED_KEY_PASS"
            echo "Using securely stored original Android keystore"
          elif [[ -n "$RECOVERY_PRIVATE_KEY_B64" ]]; then
            RECOVERY="$RUNNER_TEMP/yawmi-signing-recovery"
            mkdir -p "$RECOVERY"
            gh run download 42038925659 --repo "$GITHUB_REPOSITORY" \
              --name YAWMI_ANDROID_ENCRYPTED_SIGNING_BACKUP_DO_NOT_DELETE \
              --dir "$RECOVERY"
            printf '%s' "$RECOVERY_PRIVATE_KEY_B64" | base64 -d > "$RECOVERY/recovery-private-key.pem"
            chmod 600 "$RECOVERY/recovery-private-key.pem"
            openssl cms -decrypt -binary -inform DER \
              -in "$RECOVERY/signing-backup.cms" \
              -recip android/signing-backup-public-cert.pem \
              -inkey "$RECOVERY/recovery-private-key.pem" \
              -out "$RECOVERY/original-keystore-backup.tar.gz"
            tar -xzf "$RECOVERY/original-keystore-backup.tar.gz" \
              -C "$RECOVERY" ./yawmi-release.jks ./signing-password.txt
            cp "$RECOVERY/yawmi-release.jks" "$KEY_PATH"
            KEY_PASS="$(cat "$RECOVERY/signing-password.txt")"
            echo "::add-mask::$KEY_PASS"
            rm -f "$RECOVERY/recovery-private-key.pem" "$RECOVERY/signing-password.txt" \
                  "$RECOVERY/original-keystore-backup.tar.gz"
            echo "Recovered the ORIGINAL signing identity from the encrypted 2026-11-05 backup"
          else
            echo "WARNING: Original signing identity unavailable. QA debug APK only; NO release APK is published." >> "$GITHUB_STEP_SUMMARY"
            echo "Provide either both YAWMI_ANDROID_KEYSTORE_B64 and YAWMI_ANDROID_KEYSTORE_PASSWORD, OR YAWMI_SIGNING_RECOVERY_PRIVATE_KEY_B64 in Actions secrets." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          chmod 600 "$KEY_PATH"
          FINGERPRINT="$(keytool -list -v -keystore "$KEY_PATH" -alias yawmi -storepass "$KEY_PASS" | sed -n 's/.*SHA256: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ "$FINGERPRINT" != "c9411aebc383ec8200177d6bc2af79560290c4f0a1035b45baadccf1afb6f3d8" ]]; then
            echo "Refusing update: signing certificate differs from original v1.0.0" >&2
            exit 1
          fi
          echo "SIGNING_READY=true" >> "$GITHUB_ENV"
          echo "YAWMI_KEYSTORE_PATH=$KEY_PATH" >> "$GITHUB_ENV"
          echo "YAWMI_KEYSTORE_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          echo "YAWMI_KEY_PASSWORD=$KEY_PASS" >> "$GITHUB_ENV"
          keytool -list -keystore "$KEY_PATH" -alias yawmi -storepass "$KEY_PASS" >/dev/null

      - name: Generate Digital Asset Links deployment file
        if: env.SIGNING_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/android-public-files"
          FINGERPRINT="$(keytool -list -v -keystore "$YAWMI_KEYSTORE_PATH" -alias yawmi -storepass "$YAWMI_KEYSTORE_PASSWORD" | sed -n 's/.*SHA256: //p' | head -1)"
          if [[ -z "$FINGERPRINT" ]]; then echo 'Missing signing SHA256' >&2; exit 1; fi
          export FINGERPRINT
          python3 - <<'PY'
          import json,os
          target=[{"relation":["delegate_permission/common.handle_all_urls"],
                   "target":{"namespace":"android_app","package_name":"com.yawmilife.app",
                             "sha256_cert_fingerprints":[os.environ["FINGERPRINT"]]}}]
          with open(os.environ["RUNNER_TEMP"]+"/android-public-files/assetlinks.json","w") as f:
              json.dump(target,f,ensure_ascii=False,indent=2)
          PY
          echo "Android app signing fingerprint: $FINGERPRINT" >> "$GITHUB_STEP_SUMMARY"
          echo "To verify fullscreen TWA, publish the generated assetlinks.json at https://yawmi-life.github.io/.well-known/assetlinks.json" >> "$GITHUB_STEP_SUMMARY"

      - name: Build signed APK
        if: env.SIGNING_READY == 'true'
        shell: bash
        run: |
          set -euo pipefail
          gradle -p android --no-daemon :app:assembleRelease --stacktrace
          APK='android/app/build/outputs/apk/release/app-release.apk'
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | head -12
          sha256sum "$APK" | tee "$RUNNER_TEMP/android-public-files/apk-sha256.txt"

      - name: Upload verified original-key APK and assetlinks
        if: env.SIGNING_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: YAWMI_ANDROID_V1_3_0_SIGNED_WITH_ORIGINAL_KEY
          path: |
            android/app/build/outputs/apk/release/app-release.apk
            ${{ runner.temp }}/android-public-files/assetlinks.json
            ${{ runner.temp }}/android-public-files/apk-sha256.txt
          retention-days: 90

      - name: Publish safe update only with the original release key
        if: env.SIGNING_READY == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="android-v1.3.0"
          APK="android/app/build/outputs/apk/release/app-release.apk"
          cp "$APK" "$RUNNER_TEMP/YAWMI-LifeOS-v1.3.0.apk"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release exists: refusing to overwrite an APK using a different signing key"
          else
            gh release create "$TAG" \
              "$RUNNER_TEMP/YAWMI-LifeOS-v1.3.0.apk" \
              "$RUNNER_TEMP/android-public-files/assetlinks.json#assetlinks.json" \
              "$RUNNER_TEMP/android-public-files/apk-sha256.txt#apk-sha256.txt" \
              --repo "$GITHUB_REPOSITORY" \
              --title "يومي LifeOS — Android APK v1.3.0 (مجاني)" \
              --notes-file android/RELEASE_NOTES.md \
              --latest
          fi
          echo "Public download: https://github.com/$GITHUB_REPOSITORY/releases/download/$TAG/YAWMI-LifeOS-v1.3.0.apk" >> "$GITHUB_STEP_SUMMARY"
