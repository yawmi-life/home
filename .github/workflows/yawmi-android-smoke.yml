name: YAWMI Android native launch smoke test

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/yawmi-android-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-launch:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
          log-accepted-android-sdk-licenses: 'false'
      - name: SDK and bundled YAWMI app
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"
          mkdir -p android/app/src/main/res/drawable-nodpi android/app/src/main/assets/www android/app/src/main/assets/vendor
          cp icon-512.png android/app/src/main/res/drawable-nodpi/yawmi_icon.png
          shopt -s nullglob
          for source in *.html *.js *.css *.png *.jpg *.jpeg *.svg *.webmanifest *.ico; do
            cp "$source" android/app/src/main/assets/www/
          done
          curl -fLsS --retry 3 --connect-timeout 12 --max-time 80             "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.118.0/dist/umd/supabase.min.js"             -o android/app/src/main/assets/vendor/supabase.min.js
          gradle -p android --no-daemon :app:assembleDebug
          test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Enable emulator hardware acceleration
        shell: bash
        run: |
          if [ -e /dev/kvm ]; then sudo chmod 666 /dev/kvm; fi
      - name: Test Android first launch and home widgets on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -no-snapshot
          disable-animations: true
          script: bash android/qa-launch-smoke.sh
      - name: Save emulator screenshot and process diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: YAWMI_ANDROID_1_5_0_WIDGET_PICKER_QA
          path: /tmp/yawmi-emulator-artifacts/
          retention-days: 7
