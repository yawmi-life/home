<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>YAWMI V36 regression fixture</title><link rel="stylesheet" href="../yawmi-life-v36.css">
<style>:root{--accent:#7055bb;--accent-faint:#eae1ff;--text:#292138;--muted:#59536c;--border:#ded2f0;--panel:#fff;--surface:#faf8ff}
body{background:#f6f5fb;color:var(--text);font:15px system-ui;margin:20px;max-width:940px}
.page{padding:12px;margin:10px 0;border:1px solid var(--border)}button,input,textarea,select{font:inherit}
</style></head><body><h1>يومي V36 / QA</h1>
<section class="page on" id="page-home"><div id="ymEnhancementsHome"></div></section>
<section class="page" id="page-habits"><div class="panel">العادات</div></section>
<section class="page" id="page-books"><div id="ymBookCatalog"><form id="ymCatalogSearch"><input id="ymCatalogQuery"></form></div></section>
<section class="page" id="page-coach"><h2>المساعد الأسبوعي</h2></section>
<section class="page" id="page-tasks"></section>
<script>
const D='2026-11-05',KEY='yawmi-v36-test';
let stored=sessionStorage.getItem(KEY);
window.__state=stored?JSON.parse(stored):{version:7,demo:false,profile:{name:'اختبار'},theme:{mode:'light'},rewards:[],daily:{},
 tasks:[{id:'t1',title:'تسليم المشروع',repeat:'once',date:D,time:'09:00',priority:'high'},{id:'t2',title:'قراءة تعليمات',repeat:'once',date:D,time:'10:00',priority:'medium'},{id:'t3',title:'مهمة ثالثة',repeat:'once',date:D,time:'11:00',priority:'low'},{id:'t4',title:'مهمة رابعة',repeat:'once',date:D,time:'12:00',priority:'low'}],
 habits:[{id:'h1',title:'رياضة',repeat:'daily',active:true,target:1,unit:'مرة'},{id:'h2',title:'تعلم',repeat:'daily',active:true,target:1,unit:'مرة'}],
 lifeReminders:[],lifeCalendar:[{id:'event1',date:'2026-11-06',time:'10:00',title:'موعد دكتور'}],
 lifeNotes:[],books:[{id:'book1',title:'قوة العادات',status:'reading',currentPage:20,totalPages:250}],
 finance:{accounts:[],transactions:[]}};
window.__saveCount=0;window.__failSave=false;window.__notices=[];window.__view='home';
window.YawmiCloud={configured:true,ready:true,currentUser:{id:'qa-user'},pending:null,conflict:false,revision:3,
 flush:async()=>{},refresh:async()=>{}};
let seq=1;
window.YawmiExtraAPI={
 getState:()=>window.__state,
 today:()=>D,uid:()=>('v36-'+seq++),
 getScores:()=>({xp:155,coins:20}),
 save:()=>{window.__saveCount++;if(window.__failSave)return false;sessionStorage.setItem(KEY,JSON.stringify(window.__state));return true},
 notify:m=>window.__notices.push(String(m)),
 render:()=>window.YawmiLifeV36?.render(),
 goPage:page=>{window.__view=page;document.querySelectorAll('.page').forEach(e=>e.classList.toggle('on',e.id==='page-'+page));window.YawmiLifeV36?.render()}
};
</script><script src="../yawmi-life-v36.js"></script></body></html>
