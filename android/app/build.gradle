plugins {
    id 'com.android.application'
}

android {
    namespace 'com.yawmilife.app'
    compileSdk 36

    defaultConfig {
        applicationId 'com.yawmilife.app'
        minSdk 24
        targetSdk 35
        // GitHub Actions chooses a monotonically increasing version for each
        // verified release. Local QA builds retain the explicit baseline.
        versionCode project.findProperty('yawmiAutoCode') ? Integer.parseInt(project.property('yawmiAutoCode').toString()) : 9
        versionName project.findProperty('yawmiAutoName') ? project.property('yawmiAutoName').toString() : '1.6.0'
        resConfigs 'ar', 'en'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('YAWMI_KEYSTORE_PATH') ?: '../../unused-signing.jks')
            storePassword System.getenv('YAWMI_KEYSTORE_PASSWORD') ?: 'UNSET'
            keyAlias 'yawmi'
            keyPassword System.getenv('YAWMI_KEY_PASSWORD') ?: 'UNSET'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            // QA can produce an unsigned RELEASE APK. Signing occurs only with
            // the verified original keystore, never with a new debug identity.
            if (System.getenv('YAWMI_KEYSTORE_PATH') && file(System.getenv('YAWMI_KEYSTORE_PATH')).isFile()) {
                signingConfig signingConfigs.release
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.work:work-runtime:2.12.0'
}
