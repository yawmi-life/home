plugins {
    id 'com.android.application'
}

// A side-by-side companion is safe when the original APK signing key is not available.
def isWidgetCompanion = project.findProperty('yawmiWidgetCompanion') == 'true'

android {
    namespace 'com.yawmilife.app'
    compileSdk 36

    defaultConfig {
        applicationId isWidgetCompanion ? 'com.yawmilife.app.widgets' : 'com.yawmilife.app'
        manifestPlaceholders = [yawmiAppLabel: isWidgetCompanion ? 'يومي ويدجتس' : '@string/app_name']
        minSdk 24
        targetSdk 35
        versionCode 3
        versionName '1.2.0'
        resConfigs 'ar', 'en'
    }

    signingConfigs {
        release {
            storeFile file(System.getenv('YAWMI_KEYSTORE_PATH') ?: '../../unused-signing.jks')
            storePassword System.getenv('YAWMI_KEYSTORE_PASSWORD') ?: 'UNSET'
            keyAlias 'yawmi'
            keyPassword System.getenv('YAWMI_KEY_PASSWORD') ?: 'UNSET'
        }
    }

    buildTypes {
        debug {
            if (isWidgetCompanion) debuggable false
        }
        release {
            minifyEnabled false
            shrinkResources false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
}
